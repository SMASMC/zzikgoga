services:
  frontend:
    image: zzikgoga-frontend:latest
    container_name: zzikgoga-frontend-green
    ports:
      - "3002:80"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s