plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.1'
    id 'io.spring.dependency-management' version '1.1.5'
}

group = 'com.zzik'
version = '0.0.1-SNAPSHOT'

compileJava.options.encoding = 'UTF-8'
compileTestJava.options.encoding = 'UTF-8'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

ext {
    springCloudVersion = '2023.0.1'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    flatDir {
        dirs 'libs'
    }
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        mavenBom "software.amazon.awssdk:bom:2.28.18"
    }
}

dependencies {
    /* Boot */
    implementation 'org.springframework.boot:spring-boot-starter-web:3.3.1'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa:3.3.1'
    implementation 'org.springframework.boot:spring-boot-starter-validation:3.3.1'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor:3.3.1'
    testImplementation 'org.springframework.boot:spring-boot-starter-test:3.3.1'
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    /* OpenAPI */
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    /* Lombok */
    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'

    /* Databases */
//    runtimeOnly 'com.h2database:h2:2.2.224'
    runtimeOnly 'org.postgresql:postgresql:42.7.3'

    /* Redis */
    implementation 'org.springframework.boot:spring-boot-starter-data-redis:3.3.1'

    /* QueryDSL */
    implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
    annotationProcessor "com.querydsl:querydsl-apt:5.1.0:jakarta"
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"

    /* Security */
    implementation 'org.springframework.boot:spring-boot-starter-security:3.3.1'
    testImplementation 'org.springframework.security:spring-security-test:6.2.3'

    /* JWT */
    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

    /* findbugs */
    implementation 'com.google.code.findbugs:jsr305:3.0.2'

    /* Swagger */
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    /* AWS S3 - SDK 2.x */
    implementation 'io.awspring.cloud:spring-cloud-aws-starter:3.1.0'
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-secrets-manager:3.1.0'
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:url-connection-client'
    /* Firebase */
    implementation "com.google.firebase:firebase-admin:9.4.0"

    /* Flyway */
    implementation 'org.flywaydb:flyway-core:11.15.0'
    implementation 'org.flywaydb:flyway-database-postgresql:11.15.0'

    implementation 'com.openhtmltopdf:openhtmltopdf-pdfbox:1.0.10'
    implementation 'com.openhtmltopdf:openhtmltopdf-slf4j:1.0.10'

    // 1. EXIF 메타데이터 읽기용
    implementation 'com.drewnoakes:metadata-extractor:2.19.0'

    // 2. 이미지 리사이징 및 회전용 (Thumbnailator)
    implementation 'net.coobird:thumbnailator:0.4.20'

    // 3. WebP 포맷 지원을 위한 ImageIO 플러그인 (Thumbnailator가 사용)
    implementation "com.twelvemonkeys.imageio:imageio-core:3.12.0"
    implementation "com.twelvemonkeys.imageio:imageio-webp:3.12.0"

    // Web3j (Ethereum/Polygon)
    implementation 'org.web3j:core:4.10.3' // 안정적인 최신 버전 사용 권장

    // Spring Security Crypto (암호화)
    implementation 'org.springframework.security:spring-security-crypto'
}

// QueryDSL 설정
def querydslDir = "src/main/generated"

// java source set 에 querydsl QClass 위치 추가
sourceSets {
    main.java.srcDirs += [querydslDir]
}

// querydsl QClass 파일 생성 위치를 지정
tasks.withType(JavaCompile) {
    options.getGeneratedSourceOutputDirectory().set(file(querydslDir))
}

// gradle clean 시에 QClass 디렉토리 삭제
clean.doLast {
    file(querydslDir).deleteDir()
}
tasks.named('test') {
    useJUnitPlatform()
}
