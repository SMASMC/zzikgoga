spring:
  datasource:
    url: jdbc:postgresql://zzik.kr:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  data.redis:
    host: zzik_redis
    port: ${REDIS_PORT}
    password: ${REDIS_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        show_sql: false
        format_sql: false

jwt:
  secret-key:
    access-token: ${JWT_ACCESS_SECRET}
    refresh-token: ${JWT_REFRESH_SECRET}
    invite-token: ${JWT_INVITE_SECRET}

swagger:
  server-url: "https://api.zzik.kr/api"
  description: "프로덕션 서버"

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  redirect-uri: ${KAKAO_REDIRECT_URI}
