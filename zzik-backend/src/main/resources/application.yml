server:
  port: 8081
  servlet:
    context-path: /api
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    properties:
      dialect: org.hibernate.dialect.PostgreSQLDialect
jwt:
  expiration-time:
    access-token: 1_800_000
    refresh-token: 604_800_000
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
