server:
  port: 8081
  servlet:
    context-path: /api
spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 500MB
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    properties:
      dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: false
    default-schema: public
jwt:
  expiration-time:
    access-token: 180_000_000
    refresh-token: 604_800_000
    invite-token: 86_400_000
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html

clova-ocr:
  invoke-url: ${CLOVA_OCR_INVOKE_URL}
  secret-key: ${CLOVA_OCR_SECRET_KEY}

kakao:
  client-id: ${KAKAO_CLIENT_ID}

cloud:
  aws:
    s3:
      bucket: ${S3_BUCKET_NAME}
      region:
        static: ${S3_REGION}
      credentials:
        access-key: ${S3_ACCESS_KEY}
        secret-key: ${S3_SECRET_ACCESS_KEY}

receipt:
  upload:
    max-file-size: 52428800  # 50MB (50 * 1024 * 1024 bytes)
    allowed-extensions: jpg,jpeg,png,pdf,tif,tiff

# 외부 api 관련
external:
  bank:
    base-url: ${FINANCE_URL_BASE}
    uris:
      transfer: /demandDeposit/updateDemandDepositAccountTransfer
      transfer-list: /demandDeposit/inquireTransactionHistoryList
    credentials:
      app-key: ${FINANCE_CREDENTIALS_APP_KEY}
      user-key: ${FINANCE_CREDENTIALS_USER_KEY}
    account:
      number: ${FINANCE_ACCOUNT_NUMBER}
      bank-number: ${FINANCE_ACCOUNT_BANK_NUMBER}
    summary-texts:
      transfer:
        deposit: "여행 정산"
        withdrawal: "여행 정산"
  arweave:
    credentials:
      # 256비트(32바이트) 이상의 강력한 비밀번호
      password: ${ARWEAVE_CREDENTIALS_PASSWORD}
      # 16진수 16바이트(32자) 이상의 강력한 솔트
      salt: ${ARWEAVE_CREDENTIALS_SALT}
