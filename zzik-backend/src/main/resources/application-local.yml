spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/zzik
    username: postgres
    password: postgres
  data.redis:
    host: host.docker.internal
    port: 6379
    password: zzik
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: true
        format_sql: true

jwt:
  secret-key:
    access-token: zzikAccessAccessAccessTokenSecretKeyForzzik
    refresh-token: zzikRefreshRefreshRefreshTokenSecretKeyForzzik
    invite-token: zzikIInviteInviteInviteTokenSecretKeyForzzik

invite:
  base-url: http://localhost:5173/invite

swagger:
  server-url: "http://localhost:8081/api"
  description: "Local 테스트용 서버"

kakao:
  redirect-uri: "http://localhost:5173/auth/callback"

app:
  security:
    encrypt:
      # 256비트(32바이트) 이상의 강력한 비밀번호
      password: "YOUR_VERY_STRONG_ENCRYPTION_PASSWORD_HERE"
      # 16진수 16바이트(32자) 이상의 강력한 솔트
      salt: "a1b2c3d4e5f67890a1b2c3d4e5f67890"
