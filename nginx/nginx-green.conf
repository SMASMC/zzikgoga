# green은 8082, blue는 8081
upstream backend {
    server localhost:8082;
    keepalive 32;
}

# HTTP to HTTPS redirects
server {
    listen 80;
    server_name api.zzik.kr;
    return 301 https://$server_name$request_uri;
}

server {
    listen 80;
    server_name jenkins.zzik.kr;
    return 301 https://$server_name$request_uri;
}

server {
    listen 80;
    server_name grafana.zzik.kr;
    return 301 https://$server_name$request_uri;
}

# API HTTPS
server {
    listen 443 ssl;
    server_name api.zzik.kr;

    ssl_certificate /etc/letsencrypt/live/api.zzik.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.zzik.kr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/zzik.kr.access.log;
    error_log /var/log/nginx/zzik.kr.error.log;

    # SSE 전용 설정
    location /api/notifications/stream {
        proxy_pass http://backend;
        proxy_http_version 1.1;

        # SSE 필수 설정
        proxy_buffering off;           # 버퍼링 비활성화
        proxy_cache off;               # 캐싱 비활성화
        proxy_set_header Connection '';
        proxy_set_header Accept text/event-stream;

        # 장시간 연결을 위한 타임아웃 (30분)
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_connect_timeout 5s;

        # 청킹 지원
        chunked_transfer_encoding on;
        proxy_request_buffering off;

        # 기본 헤더
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 64k;
        proxy_buffers 16 64k;
        proxy_busy_buffers_size 128k;
    }
}

# Prometheus
server {
    listen 18080;
    server_name localhost;
    location = /actuator/prometheus {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
    }
}

# Jenkins HTTPS
server {
    listen 443 ssl;
    server_name jenkins.zzik.kr;

    ssl_certificate /etc/letsencrypt/live/api.zzik.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.zzik.kr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 443;
        proxy_request_buffering off;
    }
}

# Grafana HTTPS
server {
    listen 443 ssl;
    server_name grafana.zzik.kr;

    ssl_certificate /etc/letsencrypt/live/api.zzik.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.zzik.kr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket 지원 추가
    location /api/live/ws {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
