# /etc/nginx/sites-available/zzik.kr
# Nginx 정적 파일 호스팅 + HTTPS 설정

# HTTP → HTTPS 리다이렉션
server {
    listen 80;
    listen [::]:80;
    server_name zzik.kr www.zzik.kr;

    # Let's Encrypt ACME 챌린지용
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 모든 HTTP 트래픽을 HTTPS로 리다이렉트
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS 서버
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zzik.kr www.zzik.kr;

    # SSL 인증서 (certbot이 자동으로 설정)
    ssl_certificate /etc/letsencrypt/live/zzik.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zzik.kr/privkey.pem;

    # SSL 설정
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/zzik.kr/chain.pem;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # 보안 헤더
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 정적 파일 루트 (Blue-Green 심볼릭 링크)
    root /var/www/zzikgoga/current;
    index index.html;

    # 로그
    access_log /var/log/nginx/zzik.kr.access.log;
    error_log /var/log/nginx/zzik.kr.error.log;

    # 클라이언트 최대 업로드 크기
    client_max_body_size 10M;

    # Gzip 압축
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json image/svg+xml;

    # React Router (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 정적 파일 캐싱
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # HTML 파일은 캐시하지 않음
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # 헬스 체크
    location /health {
        alias /var/www/zzikgoga/current/health.html;
        access_log off;
    }

    # 배포 정보 (내부용)
    location /deploy-info {
        alias /var/www/zzikgoga/current/deploy-info.txt;
        allow 127.0.0.1;
        deny all;
    }

}
