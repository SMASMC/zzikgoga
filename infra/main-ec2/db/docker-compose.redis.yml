services:
  redis:
    image: redis:7-alpine
    container_name: ${REDIS_DB}
    command: ["sh", "-lc", "if [ -n \"$REDIS_PASSWORD\" ]; then exec redis-server --appendonly yes --requirepass \"$REDIS_PASSWORD\"; else exec redis-server --appendonly yes; fi"]
    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "${REDIS_PORT:-6380}:6379"  # 기존 nanuri-redis(6379) 충돌 방지
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$REDIS_PASSWORD\" ]; then redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG; else redis-cli ping | grep -q PONG; fi"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - zzik-network

networks:
  zzik-network:
    name: zzik-network
    external: true

volumes:
  redis-data:

