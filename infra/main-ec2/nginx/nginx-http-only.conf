# HTTP-only bootstrap config for initial SSL issuance.
server {
    listen 80 default_server;
    server_name _;

    # ACME challenge for all hostnames (zzik.store, api.zzik.store, jenkins.zzik.store)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Keep simple OK page to avoid upstream coupling before SSL is ready
    location / {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
