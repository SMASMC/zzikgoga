upstream node-server {
    server localhost:4002;
    keepalive 32;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name node.zzik.kr;
    return 301 https://$server_name$request_uri;
}

# Node.js Server HTTPS
server {
    listen 443 ssl;
    server_name node.zzik.kr;

    ssl_certificate /etc/letsencrypt/live/node.zzik.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/node.zzik.kr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/node.access.log;
    error_log /var/log/nginx/node.error.log;

    # CORS 설정
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;

    location / {
        proxy_pass http://node-server;
        proxy_http_version 1.1;

        # WebSocket 지원을 위한 헤더
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 기본 헤더
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket long-lived connection을 위한 타임아웃 설정
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;

        # WebSocket을 위한 버퍼링 비활성화
        proxy_buffering off;
    }
}
