# Backend API — api.zzik.kr (Cloudflare Tunnel, Green)
# cloudflared가 트래픽을 zzik-nginx:80으로 전달

# WebSocket upgrade 헤더 처리
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream backend {
    server zzikgoga-green:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name api.zzik.kr api.zzik.store;

    access_log /var/log/nginx/api.zzik.kr.access.log;
    error_log /var/log/nginx/api.zzik.kr.error.log;

    # SSE 전용 설정
    location /api/notifications/stream {
        proxy_pass http://backend;
        proxy_http_version 1.1;

        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_set_header Accept text/event-stream;

        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_connect_timeout 5s;

        chunked_transfer_encoding on;
        proxy_request_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Swagger UI
    location ^~ /api/swagger-ui/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_buffering off;
    }

    # Media upload: 500MB limit
    location ~ ^/api/media/[0-9]+/?$ {
        client_max_body_size 500M;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_request_buffering off;
    }

    # Receipt upload: 50MB limit
    location ~ ^/api/cost/[0-9]+/receipt/?$ {
        client_max_body_size 50M;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    # 기본 API 라우팅
    location / {
        proxy_pass http://backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 5s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        proxy_buffering on;
        proxy_buffer_size 64k;
        proxy_buffers 16 64k;
        proxy_busy_buffers_size 128k;
    }
}

# Prometheus (내부 전용)
server {
    listen 18080;
    server_name localhost;
    location = /actuator/prometheus {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
    }
}
