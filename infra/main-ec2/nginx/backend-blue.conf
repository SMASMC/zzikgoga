# WebSocket upgrade 헤더 처리
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream backend {
    server localhost:8081;
    keepalive 32;
}

# HTTP to HTTPS redirects (API only here; jenkins/monitoring moved to dedicated files)
server {
    listen 80;
    server_name api.zzik.kr;
    return 301 https://$server_name$request_uri;
}

# API HTTPS
server {
    listen 443 ssl;
    server_name api.zzik.kr;

    ssl_certificate /etc/letsencrypt/live/api.zzik.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.zzik.kr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/zzik.access.log;
    error_log /var/log/nginx/zzik.error.log;

    # SSE 전용 설정
    location /api/notifications/stream {
        proxy_pass http://backend;
        proxy_http_version 1.1;

        # SSE 필수 설정
        proxy_buffering off;           # 버퍼링 비활성화
        proxy_cache off;               # 캐싱 비활성화
        proxy_set_header Connection '';
        proxy_set_header Accept text/event-stream;

        # 장시간 연결을 위한 타임아웃 (30분)
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_connect_timeout 5s;

        # 청킹 지원
        chunked_transfer_encoding on;
        proxy_request_buffering off;

        # 기본 헤더
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI assets: avoid compression/buffering mismatches
    location ^~ /api/swagger-ui/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";  # disable upstream compression
        proxy_buffering off;                   # stream without buffering
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Media upload: 500MB limit
    location ~ ^/api/media/[0-9]+/?$ {
        client_max_body_size 500M;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 대용량 파일 업로드를 위한 타임아웃 연장
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # 버퍼링 설정
        proxy_request_buffering off;
    }

    # Receipt upload: 50MB limit
    location ~ ^/api/cost/[0-9]+/receipt/?$ {
        client_max_body_size 50M;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 파일 업로드를 위한 타임아웃 설정
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # 버퍼링 설정
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://backend;
        proxy_http_version 1.1;

        # WebSocket 지원을 위한 헤더
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 기본 헤더
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 타임아웃 설정 (WebSocket을 고려한 긴 타임아웃)
        proxy_connect_timeout 5s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        # 버퍼링 설정
        proxy_buffering on;
        proxy_buffer_size 64k;
        proxy_buffers 16 64k;
        proxy_busy_buffers_size 128k;
    }
}

# Prometheus
server {
    listen 18080;
    server_name localhost;
    location = /actuator/prometheus {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
    }
}

# Jenkins and Monitoring vhosts were moved to separate files to avoid server_name duplication.
