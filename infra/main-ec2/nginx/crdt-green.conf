# CRDT WebSocket Server — crdt.zzik.kr (Cloudflare Tunnel, Green)
# cloudflared가 트래픽을 localhost:80으로 전달

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream crdt-server {
    server zzikgoga-node-green:3100;
    keepalive 32;
}

server {
    listen 80;
    server_name crdt.zzik.kr crdt.zzik.store;

    access_log /var/log/nginx/crdt.zzik.kr.access.log;
    error_log /var/log/nginx/crdt.zzik.kr.error.log;

    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;

    location / {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
            add_header 'Access-Control-Max-Age' 86400;
            return 204;
        }

        proxy_pass http://crdt-server;
        proxy_http_version 1.1;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
        proxy_buffering off;
    }
}
