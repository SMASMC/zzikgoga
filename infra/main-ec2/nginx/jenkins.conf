# Jenkins — jenkins.zzik.kr (Cloudflare Tunnel)
# cloudflared가 트래픽을 localhost:80으로 전달

server {
    listen 80;
    server_name jenkins.zzik.kr;

    access_log /var/log/nginx/jenkins.zzik.kr.access.log;
    error_log  /var/log/nginx/jenkins.zzik.kr.error.log;

    location / {
        proxy_pass http://zzik-jenkins:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_request_buffering off;

        # WebSocket 지원
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
