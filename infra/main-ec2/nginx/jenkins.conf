## Jenkins vhost (split out to avoid duplication with backend files)

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name jenkins.zzik.store;
    return 301 https://$server_name$request_uri;
}

# HTTPS proxy to local Jenkins
server {
    listen 443 ssl http2;
    server_name jenkins.zzik.store;

    ssl_certificate     /etc/letsencrypt/live/jenkins.zzik.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jenkins.zzik.store/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/jenkins.access.log;
    error_log  /var/log/nginx/jenkins.error.log;

    location / {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_request_buffering off;

        # WebSocket/support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

