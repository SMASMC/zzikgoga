upstream crdt-server {
    server localhost:4001;
    keepalive 32;
}

# HTTP: redirect to HTTPS and handle ACME challenge
server {
    listen 80;
    server_name crdt.zzik.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS: CRDT WebSocket proxy
server {
    listen 443 ssl;
    server_name crdt.zzik.kr;

    ssl_certificate /etc/letsencrypt/live/crdt.zzik.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crdt.zzik.kr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/crdt.access.log;
    error_log /var/log/nginx/crdt.error.log;

    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;

    location / {
        proxy_pass http://crdt-server;
        proxy_http_version 1.1;

        # Hide CORS headers from backend to prevent duplicates
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
        proxy_buffering off;
    }
}
