# Frontend Static — zzik.kr
# Docker 없이 Nginx가 직접 정적 파일 서빙

# HTTP -> HTTPS redirect for zzik.kr
server {
    listen 80;
    server_name zzik.kr;
    return 301 https://$server_name$request_uri;
}

# Frontend HTTPS (Static)
server {
    listen 443 ssl;
    server_name zzik.kr;

    ssl_certificate /etc/letsencrypt/live/zzik.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zzik.kr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/zzik.kr.access.log;
    error_log  /var/log/nginx/zzik.kr.error.log;

    # 정적 파일 루트 디렉토리
    root /var/www/zzik-frontend/current;
    index index.html;

    # API proxy to backend
    location /api/ {
        proxy_pass https://api.zzik.kr/api/;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host api.zzik.kr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Buffer size increase for JWT token handling
        proxy_buffer_size 64k;
        proxy_buffers 16 64k;
        proxy_busy_buffers_size 128k;

        # CORS headers
        add_header 'Access-Control-Allow-Origin' 'https://zzik.kr' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' 'https://zzik.kr';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # SPA: 모든 경로를 index.html로 라우팅
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 정적 자산 캐싱
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # gzip 압축
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;
}
