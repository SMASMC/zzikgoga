## Monitoring vhost (Grafana default example) split out from backend files

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name monitoring.zzik.kr;
    return 301 https://$server_name$request_uri;
}

# HTTPS proxy to local Grafana (adjust port if needed)
server {
    listen 443 ssl http2;
    server_name monitoring.zzik.kr;

    ssl_certificate     /etc/letsencrypt/live/monitoring.zzik.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitoring.zzik.kr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/monitoring.access.log;
    error_log  /var/log/nginx/monitoring.error.log;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Port  443;
        proxy_redirect off;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }

    # Expose Prometheus UI safely under HTTPS via path
    # Result: https://monitoring.zzik.kr/prometheus/
    location /prometheus/ {
        proxy_pass http://localhost:19090/;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Port  443;
        proxy_redirect off;
        proxy_set_header Connection        "";
    }

    # Grafana live WebSocket
    location /api/live/ws {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
