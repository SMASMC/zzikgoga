# Monitoring (Grafana/Prometheus) — monitoring.zzik.kr (Cloudflare Tunnel)
# cloudflared가 트래픽을 localhost:80으로 전달

server {
    listen 80;
    server_name monitoring.zzik.kr;

    access_log /var/log/nginx/monitoring.zzik.kr.access.log;
    error_log  /var/log/nginx/monitoring.zzik.kr.error.log;

    # Grafana 메인
    location / {
        proxy_pass http://localhost:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_redirect off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Prometheus UI
    location /prometheus/ {
        proxy_pass http://localhost:19090/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_redirect off;
        proxy_set_header Connection "";
    }

    # Grafana live WebSocket
    location /api/live/ws {
        proxy_pass http://localhost:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
