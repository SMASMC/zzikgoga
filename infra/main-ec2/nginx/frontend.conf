# Frontend — zzik.kr (Cloudflare Tunnel)
# cloudflared가 트래픽을 localhost:80으로 전달

server {
    listen 80;
    server_name zzik.kr;

    access_log /var/log/nginx/zzik.kr.access.log;
    error_log  /var/log/nginx/zzik.kr.error.log;

    # 정적 파일 루트 디렉토리
    root /var/www/zzik-frontend/current;
    index index.html;

    # API proxy to backend
    location /api/ {
        proxy_pass http://api.zzik.kr/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        # Buffer size for JWT token handling
        proxy_buffer_size 64k;
        proxy_buffers 16 64k;
        proxy_busy_buffers_size 128k;
    }

    # SPA: 모든 경로를 index.html로 라우팅
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 정적 자산 캐싱
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # gzip 압축
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;
}
