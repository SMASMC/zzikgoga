upstream nft-server {
    server localhost:5002;
    keepalive 32;
}

# HTTP: redirect to HTTPS and handle ACME challenge
server {
    listen 80;
    server_name nft.zzik.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS: NFT API proxy
server {
    listen 443 ssl;
    server_name nft.zzik.kr;

    ssl_certificate /etc/letsencrypt/live/nft.zzik.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nft.zzik.kr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/nft.access.log;
    error_log /var/log/nginx/nft.error.log;

    # CORS 설정
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;

    # 파일 업로드 크기 제한 (PDF 업로드를 위해)
    client_max_body_size 10M;

    location / {
        proxy_pass http://nft-server;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
