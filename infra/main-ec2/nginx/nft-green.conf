# NFT Server — nft.zzik.kr (Cloudflare Tunnel, Green)
# cloudflared가 트래픽을 localhost:80으로 전달

upstream nft-server {
    server zzikgoga-nft-green:3200;
    keepalive 32;
}

server {
    listen 80;
    server_name nft.zzik.kr;

    access_log /var/log/nginx/nft.zzik.kr.access.log;
    error_log /var/log/nginx/nft.zzik.kr.error.log;

    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;

    client_max_body_size 10M;

    location / {
        proxy_pass http://nft-server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
