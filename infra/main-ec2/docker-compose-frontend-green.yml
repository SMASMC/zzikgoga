services:
  frontend-green:
    image: zzikgoga-frontend:latest
    container_name: zzikgoga-frontend-green
    ports:
      - "3002:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/health || curl -fsS http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
