services:
  jenkins:
    build:
      context: ./dockerfiles
      dockerfile: jenkins.dockerfile
    image: zzik-jenkins:latest
    container_name: zzik-jenkins
    user: root
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      TZ: Asia/Seoul
      JAVA_OPTS: "-Djava.awt.headless=true -Dorg.apache.commons.jelly.tags.fmt.timeZone=Asia/Seoul"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/shared-workspace:/tmp/shared-workspace
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/login"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - zzik-network

networks:
  zzik-network:
    name: zzik-network
    external: true

volumes:
  jenkins_home:
