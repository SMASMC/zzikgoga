name: Verify domain migration

on:
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zzik-front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: zzik-front/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx vite build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zzik-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: bash ./gradlew bootJar -x test
